# 每日自动采集（备份通道）
#
# 2026-11-26 起，主路径已经搬到微信云开发的 syncData 云函数：政策和行情都在
# 腾讯云国内机房直接抓，抓完写云数据库，小程序读云库。这条 GitHub 流水线
# 现在只做两件事：
#   1) 留一份完整历史——企业/园区/K线这些数据云库里没有，只有仓库里有；
#   2) 万一云库被清空，给云函数的冷启动留一个底子。
#
# 所以：这条流水线跑失败**不影响小程序**，红叉不用管。
# 只跑 fetch_all.py —— 不要在这里跑 build_enrich.py，
# 那个脚本写的是人工整理的企业与品类内容，跑一次会把人工修正覆盖掉。
#
# 失败策略：抓不到的模块由 fetch_all.py 内部的 save_or_keep 保住旧数据，
# 单个源挂了不会把 data 清空。
#
# qa.py 里"资讯条数"随当天新闻稿量波动（比如山东板块当天可能只有 1 条
# 合格稿），硬门槛会让本任务天天红叉、报警失灵。因此 qa 在这里只做
# 巡检输出（黄条提醒），条数硬门槛守在本地测试里，不在此重复拦截。

name: daily-data

on:
  schedule:
    # 每天 1 次：UTC 22:00 == 北京 06:00，赶在云函数当天第一次采集（09:40）之前。
    # 采集频率降下来是因为它不再是主路径，只是备份。
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chem-app
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取数据
        run: python scripts/fetch_all.py

      # 重建小程序数据 + 云端快照（chem-app/data/cloud_snapshot.json）。
      # 云函数 syncData 每天从 Pages 拉这份快照灌进云数据库，所以必须跟着数据一起更新。
      # 这一步失败就让任务红叉——数据构建不过关，宁可不上线也别发一份坏数据。
      - name: 重建小程序数据与云端快照
        working-directory: .
        run: python mini/scripts/build_data.py

      - name: 提交数据
        run: |
          git config user.name "chem-data-bot"
          git config user.email "chem-data-bot@users.noreply.github.com"
          git add data ../mini/data
          if git diff --cached --quiet; then
            echo "NO_CHANGE=true" >> $GITHUB_ENV
            echo "今天没有新数据，跳过提交"
          else
            git commit -m "data: $(date -u +%F)"
            git push
          fi

      # 数据巡检：输出 qa 报告；有 FAIL 时标黄提醒但不拦截上线
      # （资讯条数随稿量波动，硬门槛在本地测试里守，不在这里天天红）
      - name: 数据巡检
        run: |
          if python scripts/qa.py; then
            echo "QA_RESULT=全部通过" >> $GITHUB_ENV
          else
            echo "QA_RESULT=有报警（见上方 qa 输出，多为资讯条数随稿量波动）" >> $GITHUB_ENV
          fi
