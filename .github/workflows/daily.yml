# 每日自动采集：资讯 / 行情 / 政策
#
# 只跑 fetch_all.py —— 不要在这里跑 build_enrich.py，
# 那个脚本写的是人工整理的企业与品类内容，跑一次会把人工修正覆盖掉。
#
# 失败策略：抓不到的模块由 fetch_all.py 内部的 save_or_keep 保住旧数据，
# 单个源挂了不会把 data 清空。
#
# 注意两件事（都是实战踩过的坑）：
# 1) 用 GITHUB_TOKEN push 的提交不会触发其他 workflow（GitHub 防递归），
#    所以这里必须显式触发 pages.yml，否则数据更新了网站还是旧的。
# 2) qa.py 里"资讯条数"随当天新闻稿量波动（比如山东板块当天可能只有 1 条
#    合格稿），硬门槛会让本任务天天红叉、报警失灵。因此 qa 在这里只做
#    巡检输出（黄条提醒），条数硬门槛守在本地测试里，不在此重复拦截。

name: daily-data

on:
  schedule:
    # 每天 3 次，覆盖期货交易关键时点（缩短行情更新间隔，问题7）：
    #   UTC 01:30 == 北京 09:30（日盘早盘开盘后）
    #   UTC 07:30 == 北京 15:30（日盘收盘后，拿到当日收盘价）
    #   UTC 15:00 == 北京 23:00（夜盘收盘后）
    # 三次都跑完整 fetch_all.py：行情/K线/资讯/政策一起更新。
    - cron: "30 1 * * *"
    - cron: "30 7 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chem-app
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取数据
        run: python scripts/fetch_all.py

      - name: 提交数据
        run: |
          git config user.name "chem-data-bot"
          git config user.email "chem-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "NO_CHANGE=true" >> $GITHUB_ENV
            echo "今天没有新数据，跳过提交"
          else
            git commit -m "data: $(date -u +%F)"
            git push
          fi

      # 数据巡检：输出 qa 报告；有 FAIL 时标黄提醒但不拦截上线
      # （资讯条数随稿量波动，硬门槛在本地测试里守，不在这里天天红）
      - name: 数据巡检
        run: |
          if python scripts/qa.py; then
            echo "QA_RESULT=全部通过" >> $GITHUB_ENV
          else
            echo "QA_RESULT=有报警（见上方 qa 输出，多为资讯条数随稿量波动）" >> $GITHUB_ENV
          fi

      # 关键：GITHUB_TOKEN 的 push 不触发其他 workflow，必须显式部署
      - name: 发布到网站
        if: env.NO_CHANGE != 'true'
        run: |
          gh api repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches \
            -f ref=main && echo "已触发 Pages 部署"
        env:
          GH_TOKEN: ${{ github.token }}
