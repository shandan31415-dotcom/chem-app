name: 每日更新资讯

on:
  schedule:
    # UTC 23:00 = 北京时间次日 07:00。想改时间就改这里的小时数（UTC = 北京时间 - 8）
    - cron: "0 23 * * *"
  workflow_dispatch:        # 也可以在网页上手动点一下立即运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 取出仓库文件
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 抓取最新数据
        run: python fetch.py

      - name: 提交回仓库
        run: |
          git config user.name  "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "自动更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
